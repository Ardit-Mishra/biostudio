name: CI

# Gates the served ADMET model suite: artifact metadata validity, prediction
# schema, a known-molecule sanity check, every model loading, and the model
# card staying in sync with the manifest it describes. See
# tests/test_admet_models.py for what each check actually verifies.
#
# NOT included here: the legacy suite in tests/test_drug_likeness.py and
# tests/test_molecular_utils.py. Both currently fail (25 pre-existing
# failures against utils/drug_likeness.py and utils/molecular_utils.py,
# unrelated to this workflow and out of its scope) -- gating on them would
# make this workflow red from its first run, which is worse than not gating
# on them at all. Tracked as a follow-up, not hidden with continue-on-error.

on:
  pull_request:
  push:
    branches:
      - ui/instrument-design-system

jobs:
  admet-model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Run ADMET model test suite
        run: >
          uv run --python 3.12 --with-requirements requirements.txt --with pytest
          python -m pytest tests/test_admet_models.py -v
