name: CI

# Gates the served ADMET model suite: artifact metadata validity, prediction
# schema, a known-molecule sanity check, every model loading, and the model
# card staying in sync with the manifest it describes. See
# tests/test_admet_models.py for what each check actually verifies.
#
# This comment previously said the legacy suites in tests/test_drug_likeness.py
# and tests/test_molecular_utils.py were excluded because of 25 pre-existing
# failures. Both statements were stale: the workflow runs `pytest tests/`
# wholesale and excludes nothing, and the complete suite passes. Corrected
# rather than left in place, because a comment describing behaviour the file
# does not have is worse than no comment. The old wording also quoted a fixed
# pass count, which went stale the moment a test was added -- so no count is
# repeated here.
#
# --no-project is load-bearing. pyproject.toml now declares real dependencies
# (they were previously misfiled under [project.urls] and invisible), so
# without it `uv run` would resolve and sync the project itself and only then
# layer these requirements on top -- testing a graph that is not the committed
# lock. With it, the environment is exactly two tiers: requirements.txt, the
# runtime lock, plus requirements-dev.txt, which is test-only. The image
# installs the runtime tier only -- it ships no test dependencies and
# .dockerignore keeps tests/ out of it -- so CI exercises the same runtime
# dependency graph the container runs, with the test tier layered on top
# here and nowhere else.

on:
  pull_request:
  push:
    branches:
      - main
      - ui/instrument-design-system

jobs:
  admet-model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Run ADMET model test suite
        run: >
          uv run --no-project --python 3.12 --with-requirements requirements.txt --with-requirements requirements-dev.txt python -m pytest tests/ -v
