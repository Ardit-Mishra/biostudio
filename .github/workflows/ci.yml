name: CI

# Gates the served ADMET model suite: artifact metadata validity, prediction
# schema, a known-molecule sanity check, every model loading, and the model
# card staying in sync with the manifest it describes. See
# tests/test_admet_models.py for what each check actually verifies.
#
# This comment previously said the legacy suites in tests/test_drug_likeness.py
# and tests/test_molecular_utils.py were excluded because of 25 pre-existing
# failures. Both statements were stale: the workflow runs `pytest tests/`
# wholesale and excludes nothing, and the suite now passes 184/184. Corrected
# rather than left in place, because a comment describing behaviour the file
# does not have is worse than no comment.

on:
  pull_request:
  push:
    branches:
      - main
      - ui/instrument-design-system

jobs:
  admet-model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Run ADMET model test suite
        run: >
          uv run --python 3.12 --with-requirements requirements.txt --with-requirements requirements-dev.txt python -m pytest tests/ -v
